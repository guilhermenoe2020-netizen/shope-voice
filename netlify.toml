[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Redireciona as chamadas /api/* do frontend para o backend hospedado
# separadamente (Render, Railway, etc). Troque a URL abaixo pela
# URL real do seu backend depois de publicá-lo.
[[redirects]]
  from = "/api/*"
  to = "https://shope-voice-1.onrender.com/api/:splat"
  status = 200
  force = true

# Garante que rotas internas do React (hash routing) funcionem
# corretamente ao recarregar a página.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
